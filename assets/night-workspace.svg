<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Pixel art night studio: aerospace engineer coding beside a view of Earth. Animated stars, aircraft simulation, blinking cursor and steaming coffee."><style>
svg{shape-rendering:crispEdges}
.star{animation:twinkle 3s steps(2,end) infinite}.star.b{animation-delay:1s}.star.c{animation-delay:2s}
.cursor{animation:twinkle .85s steps(2,end) infinite}
.orbit{stroke-dasharray:5 7;animation:dash 12s linear infinite}
.jet{animation:flight 9s ease-in-out infinite;transform-origin:697px 151px}
.steam{animation:rise 2.8s ease-in-out infinite;opacity:0}.steam.b{animation-delay:1.15s}
.led{animation:twinkle 2s steps(2,end) infinite}.lamp{animation:glow 4s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.15}}
@keyframes dash{to{stroke-dashoffset:-240}}
@keyframes flight{0%,100%{transform:translate(-4px,3px) rotate(-2deg)}50%{transform:translate(8px,-5px) rotate(2deg)}}
@keyframes rise{0%{opacity:0;transform:translateY(8px)}35%{opacity:.65}100%{opacity:0;transform:translateY(-19px)}}
@keyframes glow{50%{opacity:.73}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
