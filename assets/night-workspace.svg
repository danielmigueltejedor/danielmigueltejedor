<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-label="Animated pixel-art night workspace: code, flight simulation and stars">
<style>
.st{animation:blink 3s steps(2,end) infinite}.s2{animation-delay:1s}.s3{animation-delay:2s}
.cursor{animation:blink .8s steps(2,end) infinite}
.scan{animation:scan 6s linear infinite}
.satellite{animation:fly 18s linear infinite}
@keyframes blink{50%{opacity:.1}}
@keyframes scan{0%{transform:translateX(-130px)}100%{transform:translateX(220px)}}
@keyframes fly{0%{transform:translate(-40px,25px)}100%{transform:translate(1000px,-110px)}}
</style>
<rect width="960" height="280" fill="#111b2d"/>
<rect y="176" width="960" height="104" fill="#1a2b3e"/>
<path d="M0 176H960" stroke="#526579" stroke-width="4"/>
<g fill="#b5cbd8"><rect class="st" x="44" y="33" width="4" height="4"/><rect class="st s2" x="151" y="66" width="3" height="3"/><rect class="st s3" x="274" y="20" width="4" height="4"/><rect class="st" x="450" y="56" width="3" height="3"/><rect class="st s2" x="578" y="24" width="4" height="4"/><rect class="st s3" x="731" y="70" width="3" height="3"/><rect class="st" x="849" y="30" width="4" height="4"/><rect class="st s2" x="924" y="95" width="4" height="4"/></g>
<circle cx="835" cy="82" r="32" fill="#d2c7a0"/><path d="M0 159L100 117 185 144 292 91 381 149 492 109 583 150 689 106 770 147 960 113V177H0Z" fill="#263e52"/>
<g class="satellite" fill="#cbd7dd"><rect x="0" y="0" width="16" height="5"/><rect x="20" y="0" width="11" height="5"/><rect x="17" y="-3" width="3" height="10"/></g>
<!-- Desk and monitor -->
<rect x="280" y="205" width="427" height="13" fill="#a77c59"/>
<rect x="304" y="218" width="17" height="62" fill="#795c4a"/><rect x="667" y="218" width="17" height="62" fill="#795c4a"/>
<rect x="359" y="75" width="245" height="133" rx="3" fill="#3b5268"/><rect x="367" y="83" width="229" height="114" fill="#0b1725"/>
<rect x="383" y="99" width="99" height="5" fill="#83c4b9"/><rect x="383" y="113" width="172" height="5" fill="#d3aa7d"/><rect x="394" y="127" width="145" height="5" fill="#a6a9dd"/><rect x="394" y="141" width="112" height="5" fill="#83c4b9"/><rect x="383" y="155" width="170" height="5" fill="#d3aa7d"/><rect x="383" y="169" width="87" height="5" fill="#a6a9dd"/><rect class="cursor" x="475" y="168" width="6" height="9" fill="#f5eddc"/>
<rect x="468" y="208" width="30" height="11" fill="#40566b"/>
<!-- second screen with moving plot -->
<rect x="628" y="111" width="112" height="83" rx="3" fill="#40566b"/><rect x="635" y="119" width="98" height="68" fill="#0b1725"/><path d="M645 171 661 155 676 162 692 139 708 151 723 130" stroke="#92c6bf" stroke-width="3" fill="none"/><rect class="scan" x="645" y="123" width="3" height="61" fill="#e0b47b" opacity=".75"/>
<!-- coffee and notebook -->
<rect x="298" y="179" width="29" height="26" fill="#d8bc97"/><rect x="327" y="185" width="9" height="12" fill="none" stroke="#d8bc97" stroke-width="4"/>
